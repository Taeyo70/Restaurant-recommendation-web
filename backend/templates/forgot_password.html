<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - FoodFinder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">
    <main class="login-container">
        <div class="login-box">
            <div class="login-icon">🔑</div>
            <h1>Change Password</h1>
            <p class="login-subtitle">Enter your registered email and choose a new password.</p>

            {% if error %}
                <p class="auth-error">{{ error }}</p>
            {% endif %}

            {% if message %}
                <p style="color: #15803d; margin-bottom: 18px; font-weight: 700;">{{ message }}</p>
            {% endif %}

            <form action="/forgot-password" method="POST">
                <div class="input-box">
                    <span>✉</span>
                    <input type="email" name="email" placeholder="Registered email" required>
                </div>

                <div class="input-box">
                    <span>🔒</span>
                    <input type="password" name="password" placeholder="New password, minimum 8 characters" minlength="8" required>
                </div>

                <button class="main-button" type="submit">Save New Password</button>
            </form>

            <p class="auth-register-link">
                <a href="/">Back to login</a>
            </p>
        </div>
    </main>
</body>
</html>
